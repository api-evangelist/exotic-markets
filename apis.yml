aid: exotic-markets
name: Exotic Markets
description: 'Exotic Markets is a decentralized options and structured-products protocol on the Solana
  blockchain, describing itself as the #1 options protocol on Solana and backed by Multicoin Capital.
  The platform lets users earn yield or buy call/put options through flexible structured products,
  including baskets of tokens, accumulators, and capital-preservation strategies with customizable
  payoffs and maturities. Access is on-chain via a Solana wallet (Phantom, Solflare) and the $EXO token
  powers staking, points, and protocol utility. Exotic Markets is a smart-contract DeFi protocol rather
  than a REST/HTTP API provider: there is no public OpenAPI, gateway, or hosted developer API surface;
  developer materials are limited to GitBook documentation, a GitHub organization, and community
  channels.'
